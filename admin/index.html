<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNLOCKED ARC — Admin</title><link rel="stylesheet" href="../style.css"><style>body{min-height:100vh}.admin{max-width:1200px;margin:auto;padding:130px 6vw 80px}.adminbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:35px}.adminbar h1{font-size:clamp(38px,6vw,70px)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:25px;margin-bottom:20px}.auth{max-width:520px;margin:130px auto}.story-row{padding:20px 0;border-bottom:1px solid var(--line)}.meta{color:var(--muted);font-size:13px}.story-body{white-space:pre-wrap;color:#ddd;margin:15px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.select{padding:11px;border-radius:10px;border:1px solid var(--line);background:#0b0b0b;color:var(--text)}.hidden{display:none}.photo{max-width:280px;border-radius:12px;margin-top:15px}</style></head><body><main class="admin"><section id="login-panel" class="panel auth"><p class="eyebrow">PRIVATE AREA</p><h1>Admin login</h1><p class="lead">UNLOCKED ARC story management.</p><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">Sign in</button><p id="login-message" class="note"></p></form></section><section id="dashboard" class="hidden"><div class="adminbar"><div><p class="eyebrow">UNLOCKED ARC</p><h1>Stories</h1></div><button id="logout" class="btn">Sign out</button></div><div id="dashboard-message" class="panel"></div><div id="stories" class="panel"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="app.js"></script></body></html>
